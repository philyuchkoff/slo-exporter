version: 2
updates:
  # Автоматическое обновление Go-зависимостей
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      prometheus:
        patterns:
          - "github.com/prometheus/*"
      indirect-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/prometheus/*"

  # Автоматическое обновление GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5